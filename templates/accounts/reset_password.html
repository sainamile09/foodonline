{% extends 'base.html' %}
{% block content %}

<style>
    .login-section {
        min-height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
    }
    
    .login-card {
        background: #fff;
        border-radius: 15px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        padding: 40px;
        max-width: 450px;
        width: 100%;
    }
    
    .login-title {
        color: #333;
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 10px;
        text-align: center;
    }
    
    .login-subtitle {
        color: #666;
        margin-bottom: 30px;
        text-align: center;
        font-size: 14px;
    }
    
    .form-group {
        margin-bottom: 20px;
    }
    
    .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #333;
        font-weight: 500;
        font-size: 14px;
    }
    
    .form-control {
        width: 100%;
        padding: 12px 15px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 14px;
        transition: border-color 0.3s;
        box-sizing: border-box;
    }
    
    .form-control:focus {
        outline: none;
        border-color: #667eea;
    }
    
    .btn-login {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border: none;
        border-radius: 8px;
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s;
    }
    
    .btn-login:hover {
        transform: translateY(-2px);
    }
    
    .signup-link {
        text-align: center;
        margin-top: 20px;
        color: #666;
        font-size: 14px;
    }
    
    .signup-link a {
        color: #667eea;
        font-weight: 600;
        text-decoration: none;
    }
    
    .signup-link a:hover {
        text-decoration: underline;
    }
</style>

<div class="login-section">
    <div class="login-card">
        <h4 class="login-title">Reset Password!</h4>
        <p class="login-subtitle">Reset your password to FoodOnline</p>
        
        <!-- Messages Display -->
        {% include 'includes/alerts.html' %}
        
        <form action="{% url 'reset_password' %}" method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
            </div>
            
            <div class="form-group">
                <label>ConfirmPassword</label>
                <input type="password" name="confirm_password" class="form-control" placeholder="Enter your password" required>
            </div>
            
            <div class="form-group">
                <button type="submit" class="btn-login">Reset Password</button>
                
            </div>
            
        </form>
    </div>
</div>

{% endblock %}
